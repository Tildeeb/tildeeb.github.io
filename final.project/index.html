<!DOCTYPE html>
<html>
<head>
  <title>Terrible Volume Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Volume Control, good luck!</h2>
  <p>Drag each slice into the circle to raise the volume by 10%.</p>

  <div id="progress">0% complete</div>

  <button id="confirmBtn">Begin the volume adjustment</button>
  <button id="resetBtn">Reset the nonsense</button>

  <audio id="audio" src="audio.mp3" loop></audio>

  <div id="game">
    <div id="circle"></div>

    <div class="piece" id="p1"></div>
    <div class="piece" id="p2"></div>
    <div class="piece" id="p3"></div>
    <div class="piece" id="p4"></div>
    <div class="piece" id="p5"></div>
    <div class="piece" id="p6"></div>
    <div class="piece" id="p7"></div>
    <div class="piece" id="p8"></div>
    <div class="piece" id="p9"></div>
    <div class="piece" id="p10"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
